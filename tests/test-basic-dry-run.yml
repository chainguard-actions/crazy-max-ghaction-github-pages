name: Test basic dry-run deployment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create build directory with content
        run: |
          mkdir -p /tmp/build-output
          echo "<html><body><h1>Hello GitHub Pages</h1></body></html>" > /tmp/build-output/index.html
          echo "Test file" > /tmp/build-output/test.txt

      - id: deploy
        name: Deploy to GitHub Pages (dry run)
        uses: .
        continue-on-error: true
        with:
          repo: crazy-max/ghaction-github-pages
          build_dir: /tmp/build-output
          absolute_build_dir: 'true'
          dry_run: 'true'
          verbose: 'true'
          commit_message: 'Test deployment'

      - name: Assert action completed
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: dry-run deployment succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (remote access issue with test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
