name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create build directory
        run: mkdir -p /tmp/build-output && echo "Hello GitHub Pages" > /tmp/build-output/index.html
      - id: action
        uses: .
        with:
          build_dir: /tmp/build-output
          absolute_build_dir: 'true'
          dry_run: 'true'
          verbose: 'true'
      - name: Assert action completed
        run: |
          echo "Action completed successfully in dry_run mode"
          echo "PASS"
