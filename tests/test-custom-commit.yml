name: Test custom commit metadata
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create build directory
        run: |
          mkdir -p /tmp/build-custom
          echo "<html><body>Custom commit test</body></html>" > /tmp/build-custom/index.html
      - id: action
        uses: .
        with:
          build_dir: /tmp/build-custom
          absolute_build_dir: 'true'
          dry_run: 'true'
          verbose: 'true'
          author: 'Test Author <test-author@example.com>'
          committer: 'Test Committer <test-committer@example.com>'
          commit_message: 'Deploy test pages'
          repo: ${{ github.repository }}
      - name: Assert custom commit metadata accepted
        run: |
          echo "Action completed successfully with custom author, committer, commit_message, and repo"
          echo "PASS"
