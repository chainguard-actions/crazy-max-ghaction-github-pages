name: Test custom options dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create build directory with content
        run: |
          mkdir -p /tmp/custom-build
          echo "<html><body><h1>Custom Site</h1></body></html>" > /tmp/custom-build/index.html
          echo "Custom content" > /tmp/custom-build/about.html

      - id: deploy
        name: Deploy with custom options (dry run)
        uses: .
        continue-on-error: true
        with:
          repo: crazy-max/ghaction-github-pages
          build_dir: /tmp/custom-build
          absolute_build_dir: 'true'
          target_branch: 'gh-pages-custom'
          dry_run: 'true'
          verbose: 'true'
          fqdn: 'example.com'
          jekyll: 'false'
          commit_message: 'Custom deployment commit'
          committer: 'Test Bot <testbot@example.com>'
          author: 'Test Author <testauthor@example.com>'

      - name: Assert action completed with custom options
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: custom options dry-run deployment succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (remote access issue with test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
