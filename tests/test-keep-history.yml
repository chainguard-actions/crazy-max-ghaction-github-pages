name: Test keep history dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create build directory with content
        run: |
          mkdir -p /tmp/history-build
          echo "<html><body><h1>History Site</h1></body></html>" > /tmp/history-build/index.html
          echo "v1.0.0" > /tmp/history-build/version.txt

      - id: deploy
        name: Deploy with keep_history enabled (dry run)
        uses: .
        continue-on-error: true
        with:
          repo: crazy-max/ghaction-github-pages
          build_dir: /tmp/history-build
          absolute_build_dir: 'true'
          keep_history: 'true'
          dry_run: 'true'
          verbose: 'true'
          commit_message: 'Incremental deployment'

      - name: Assert action completed with keep_history
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: keep_history dry-run deployment succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (remote access issue with test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
